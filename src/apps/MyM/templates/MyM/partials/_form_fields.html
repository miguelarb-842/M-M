{% if form.non_field_errors %}
    <div class="errores">{{ form.non_field_errors }}</div>
{% endif %}

{% for field in form %}
    <div class="campo">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
            <p class="ayuda">{{ field.help_text }}</p>
        {% endif %}
        {% if field.errors %}
            <div class="errores">{{ field.errors }}</div>
        {% endif %}
    </div>
{% endfor %}
